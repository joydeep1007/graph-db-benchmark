# docker-compose.yml
# Spins up Memgraph, ArangoDB, and SurrealDB locally
# with the same resource caps used on Render free tier.
#
# Usage:
#   docker compose up -d
#   # wait ~30s for all services to be ready
#   docker compose ps
#   docker compose down   # teardown
#
# Credentials: all read from your .env file (loaded by docker compose automatically)



services:

  # ── Memgraph ─────────────────────────────────────────────────
  memgraph:
    image: memgraph/memgraph:2.14.0
    ports:
      - "7687:7687"
    command:
      - "--storage-mode=ON_DISK_TRANSACTIONAL"
      - "--memory-limit=256"
      - "--log-level=WARNING"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    volumes:
      - memgraph_data:/var/lib/memgraph
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --use-ssl=false"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ArangoDB ──────────────────────────────────────────────────
  arangodb:
    image: arangodb/arangodb:3.11
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGODB_PASSWORD}
      # Tell ArangoDB it has 256 MB so it sizes caches proportionally
      ARANGODB_OVERRIDE_DETECTED_TOTAL_MEMORY: "536870912"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "arangosh", "--server.endpoint", "http://127.0.0.1:8529", "--server.username", "root", "--server.password", "${ARANGODB_PASSWORD}", "--javascript.execute-string", "db._version()"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── SurrealDB ─────────────────────────────────────────────────
  surrealdb:
    image: surrealdb/surrealdb:v1.4.2
    user: root
    ports:
      - "8000:8000"
    command:
      - start
      - "--log"
      - "info"
      - "--user"
      - "root"
      - "--pass"
      - "${SURREALDB_PASSWORD}"
      - "rocksdb:/data/pokec.db"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    volumes:
      - surrealdb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── FalkorDB ──────────────────────────────────────────────────
  falkordb:
    image: falkordb/falkordb:v4.20.1
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  memgraph_data:
  arangodb_data:
  surrealdb_data:
  falkordb_data:
